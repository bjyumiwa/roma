<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0e8">
<title>Vienna 2026 | WAIE式 英語発表練習</title>
<style>
:root{
  --bg:#f4f0e8; --paper:#fffdf8; --ink:#19222d; --muted:#67717c;
  --accent:#2f556f; --accent2:#e5edf2; --line:#d9d4ca; --stress:#ffe8a6;
  --danger:#8a3d3d; --ok:#2d6a4f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;
  background:var(--bg); color:var(--ink);
}
button,select,input{font:inherit}
button{-webkit-tap-highlight-color:transparent; touch-action:manipulation}
header{
  position:sticky; top:0; z-index:10;
  background:rgba(244,240,232,.97);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)
}
.wrap{max-width:980px;margin:auto;padding:14px 16px}
.topline{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:clamp(22px,3vw,34px);margin:0;letter-spacing:.01em}
.sub{color:var(--muted);margin-top:4px;font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{
  border:1px solid var(--line); background:var(--paper);
  padding:10px 14px; border-radius:999px; cursor:pointer; font-weight:700
}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.controls{
  display:grid; grid-template-columns:repeat(6,minmax(0,1fr));
  gap:8px; margin-top:14px
}
.ctrl{
  border:0; background:var(--accent); color:#fff;
  border-radius:12px; padding:12px 8px; cursor:pointer; font-weight:700;
  min-height:46px
}
.ctrl.secondary{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.ctrl.stop{background:var(--danger)}
.ctrl:active,.tab:active,.line-card:active{transform:translateY(1px)}
.settings{
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
  margin-top:12px; padding:12px; background:var(--paper);
  border:1px solid var(--line); border-radius:14px
}
.setting label{
  display:flex;justify-content:space-between;gap:8px;
  font-size:13px;color:var(--muted);margin-bottom:6px
}
select{
  width:100%;padding:10px;border:1px solid var(--line);
  border-radius:10px;background:#fff;min-height:44px
}
input[type=range]{width:100%;min-height:32px}
.now{
  margin-top:12px;padding:12px 14px;border-radius:12px;
  background:var(--accent2);font-size:14px;line-height:1.55
}
.status-ok{color:var(--ok);font-weight:700}
main{max-width:980px;margin:auto;padding:10px 16px 70px}
.slide-section{
  background:var(--paper);border:1px solid var(--line);border-radius:18px;
  padding:16px;margin:16px 0;box-shadow:0 8px 24px rgba(33,43,54,.04)
}
.slide-section h2{font-size:18px;margin:0 0 10px;color:var(--accent)}
.line-card{
  width:100%;display:grid;grid-template-columns:44px 1fr 36px;
  gap:8px;align-items:center;text-align:left;border:0;
  border-top:1px solid #ebe7df;background:transparent;
  padding:14px 6px;cursor:pointer;color:var(--ink)
}
.line-card:first-of-type{border-top:0}
.line-card:hover{background:#f7f9fa}
.line-card.active{background:#e8f0f5;border-radius:10px}
.num{font-variant-numeric:tabular-nums;color:#9a9287;font-size:12px}
.txt{font-size:17px;line-height:1.6}
.play-icon{color:var(--accent);text-align:center;font-size:18px}
mark{background:var(--stress);padding:0 .18em;border-radius:.25em}
.hidden{display:none!important}
.legend{font-size:13px;color:var(--muted);margin:14px 0}
.mobile-note{display:none}

@media(max-width:720px){
  header{position:relative}
  .wrap{padding:14px 12px}
  .controls{grid-template-columns:repeat(2,1fr)}
  .settings{grid-template-columns:1fr}
  main{padding:8px 10px 60px}
  .slide-section{padding:12px;margin:12px 0}
  .line-card{grid-template-columns:34px 1fr 30px;padding:13px 4px}
  .txt{font-size:16px;line-height:1.55}
  .mobile-note{display:block;font-size:12px;color:var(--muted);margin-top:8px}
}


.slide-photo{width:100%;max-width:780px;display:block;margin:8px auto 18px;border:1px solid #ddd7ca;border-radius:12px;cursor:zoom-in;aspect-ratio:16/9;object-fit:contain;background:#f6f6f6}
.kana{display:block;font-size:14px;line-height:1.65;color:#607087;margin-top:8px;font-weight:500}
.jp-text{font-size:15px;color:#35434b;line-height:1.8;background:#f4f6f7;padding:12px 15px;border-radius:12px;margin:12px 0 8px;white-space:pre-wrap}
.speech-help{font-size:12px;color:var(--muted);padding:6px 0}
body.no-kana .kana{display:none}
body.no-jp .jp-text{display:none}
#zoomLayer{border:0;background:#14191f;padding:14px;max-width:96vw;max-height:96vh;border-radius:8px;box-shadow:0 20px 80px #0009}
#zoomLayer::backdrop{background:#111c}
#zoomLayer img{display:block;max-width:92vw;max-height:83vh;object-fit:contain;margin:auto}
#zoomLayer button{background:#fff;border:0;border-radius:8px;padding:9px 18px;margin-bottom:10px;cursor:pointer}
@media(max-width:720px){.kana{font-size:13px}.jp-text{font-size:14px}.slide-photo{margin:8px auto 10px}}

</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="topline">
      <div>
        <h1>Vienna 2026 English Practice</h1>
        <div class="sub">ゆっくり聞く → まねして言う → 1文ずつ進む</div>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="main">話しやすい英語</button>
        <button class="tab" data-tab="qa">Academic 英語</button>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl" id="playAll">▶ 続けて再生</button>
      <button class="ctrl secondary" id="playOne">▶ この文</button>
      <button class="ctrl secondary" id="repeat3">↻ 3回練習</button>
      <button class="ctrl secondary" id="prev">← 前の文</button>
      <button class="ctrl secondary" id="next">次の文 →</button>
      <button class="ctrl stop" id="stop">■ 停止</button>
    </div>

    <div class="settings">
      <div class="setting">
        <label>
          <span>読み上げ速度</span>
          <strong id="rateLabel">0.70×</strong>
        </label>
        <input id="rate" type="range" min="0.45" max="1.15" step="0.05" value="0.70">
      </div>

      <div class="setting">
        <label>
          <span>英語音声</span>
          <span>iPhone / Android / PC</span>
        </label>
        <select id="voice">
          <option value="">端末の音声を使用（WAIE方式）</option>
        </select>
      </div>
    </div>

    <div class="settings" style="margin-top:8px">
      <label class="setting" style="display:flex;align-items:center;gap:8px;font-size:14px"><input id="showKana" type="checkbox" checked> カタカナを表示</label>
      <label class="setting" style="display:flex;align-items:center;gap:8px;font-size:14px"><input id="showJp" type="checkbox" checked> 日本語訳を表示</label>
      <button class="ctrl secondary" style="min-height:40px" id="voiceTest">🔊 音声テスト（Hello）</button>
      <label class="setting" style="font-size:13px">スライドへ移動<select id="jumpTo"><option value="">スライドを選ぶ</option></select></label>
    </div>
    <div class="now" id="now">文をタップすると、その文から練習できます。</div>
    <div class="mobile-note">スマホでは最初に「▶ この文」または本文の文を1回タップしてください。</div>
  </div>
</header>

<main>
  <div class="legend">文をタップすると、その文の英語を読み上げます。スライド画像をタップすると拡大できます。</div>
  <div id="mainMode"></div>
  <div id="qaMode" class="hidden"></div>
</main>
<dialog id="zoomLayer"><button id="zoomClose">✕ 閉じる</button><img id="zoomImage" alt="スライド拡大"></dialog>

<script>
(() => {
  "use strict";

  const MAIN_SECTIONS = [{"title":"Slide 1 · Students use AI, but they make the decisions","image":"slides/slide-01.jpg","jp":"みなさん、こんにちは。私は日本の公立中学校で美術を教えながら、生成AIを用いた美術教育を研究しています。今日のテーマは、生成AIとの「Distance」、つまり距離の取り方です。AI画像を作品に生かす生徒もいれば、一度試したあとに手描きを選ぶ生徒もいます。その違いを、単に「AIを使ったかどうか」で捉えてよいのでしょうか。","lines":[{"t":"Hello, everyone.","kana":"ヘロウ, エヴリワン、"},{"t":"I teach art at a public lower-secondary school in Japan, and I research generative AI in art education.","kana":"アイ ティーチ アート アト ア パブリック ロウア・セカンダリ スクール イン ジャパン, アン アイ リサーチ ジェネラティヴ エイアイ イン アート エジュケイション、"},{"t":"Today I will discuss Distance.","kana":"トゥデイ アイ ウィル ディスカス ディスタンス、"},{"t":"I use this term to describe how students decide what to keep, change or set aside from AI-generated images.","kana":"アイ ユーズ ディス ターム トゥ ディスクライブ ハウ スチューデンツ ディサイド ウォット トゥ キープ, チェインジ オール セト アサイド フロム エイアイ・ジェネレイティド イミジズ、"},{"t":"The important point is that students make these decisions in relation to their own expressive intentions.","kana":"ザ インポータント ポイント イズ ザット スチューデンツ メイク ジーズ ディシジョンズ イン リレイション トゥ ゼア オウン イクスプレッシヴ インテンションズ、"}]},{"title":"Slide 2 · AI use does not tell the whole story","image":"slides/slide-02.jpg","jp":"生成AIは、短時間で整った画像をつくれます。しかし、たくさん画像を生成したからといって、その画像を作品に採用したとは限りません。反対に、生成回数が少なくても、前の授業で見た画像が作品に影響しているかもしれません。本研究では、AI画像との関わりを「使った量」だけで判断せず、生徒がその提案をどう受け止め、表現に組み直したかを明らかにしたいと考えています。","lines":[{"t":"AI can generate several images very quickly.","kana":"エイアイ キャン ジェネレイト セヴラル イミジズ ヴェリ クウィックリ、"},{"t":"But generating an image does not mean that its elements will appear in the artwork.","kana":"バット ジェネレイティング アン イミジ ダズ ノット ミーン ザット イトス エレメンツ ウィル アピア イン ザ アートワーク、"},{"t":"A student may create many images and adopt none.","kana":"ア スチューデント メイ クリエイト メニ イミジズ アン アドプト ナン、"},{"t":"Another may keep an element from an earlier image.","kana":"アナザー メイ キープ アン エレメント フロム アン アーリア イミジ、"},{"t":"This is why I separate the amount of AI use from the degree of adoption.","kana":"ディス イズ ワイ アイ セパレイト ザ アマウント アヴ エイアイ ユーズ フロム ザ ディグリー アヴ アドプション、"}]},{"title":"Slide 3 · Student responses suggest several paths","image":"slides/slide-03.jpg","jp":"方法の説明に入る前に、生徒の声を三つ紹介します。自由記述に、②で0回と答えた生徒の異なる理由が示されています。「AIの画像が思っている感じのものだったから」と答えた生徒は、すでに十分な画像があった可能性を示します。また「桜の木を一つだけにしたこと、残したところは花びらの散り方」と書いた生徒は、AI案を参照しつつ変更しています。一方「プロンプトが難しくて、自分で考えて書いたほうが簡単だと思った」と回答した生徒もいました。スライドは英訳と要約で、原文の全訳ではありません。満足、選択的活用、方法の変更という多様な動機を示す例ですが、個別の制作記録で追認する必要があります。","lines":[{"t":"Before going into the method, here are three students’ voices.","kana":"ビフォー ゴウイング イントゥ ザ メソッド, ヒール アー スリー スチューデンツ’ ヴォイシズ、"},{"t":"These shortened translations show three different experiences among students who reported zero new images in Survey 2.","kana":"ジーズ ショールタンド トランズレイシャンズ ショウ スリー ディファレント イクスピリーアンシズ アマング スチューデンツ フー リポーティド ズィーロウ ニュー イミジズ イン サーヴェイ トゥー、"},{"t":"One said an AI-generated image matched what they had imagined.","kana":"ワン セド アン エイアイ・ジェネレイティド イミジ マッチト ウォット ゼイ ハド イマジンド、"},{"t":"Another retained the falling petals but changed the tree.","kana":"アナザー リテインド ザ ファリング ペタルズ バット チェインジド ザ トリー、"},{"t":"A third found drawing easier than writing prompts.","kana":"ア サード ファウンド ドローイング イージーアー ザン ライティング プラムプトス、"},{"t":"They illustrate different possible decisions.","kana":"ゼイ イラストレイト ディファレント ポッシブル ディシジョンズ、"},{"t":"They do not prove why each student generated no new images that day.","kana":"ゼイ ドゥー ノット プルヴ ワイ イーチ スチューデント ジェネレイティド ノウ ニュー イミジズ ザット デイ、"}]},{"title":"Slide 4 · Where did the orange idea begin?","image":"slides/slide-04.jpg","jp":"②には「オレンジのきれいな背景は残しました」「オレンジの色が想像していた色にぴったりだったから」という回答があります。これは、AI画像から新しい色の発想を得たのか、AI画像がもともとのイメージを確かめる材料となったのかを区別する必要がある例です。文章と最初のスケッチ、AI画像、作品を時系列に比べることが重要です。この問いを念頭に置いて、研究の目的に進みます。","lines":[{"t":"One student said they kept an orange background because it matched the colour they had imagined.","kana":"ワン スチューデント セド ゼイ ケプト アン オレンジ バクグラウンド ビコーズ イット マッチト ザ カラー ゼイ ハド イマジンド、"},{"t":"But where did this idea begin?","kana":"バット ウェア ディド ディス アイディーア ビギン？"},{"t":"The AI-generated image may have introduced the colour.","kana":"ザ エイアイ・ジェネレイティド イミジ メイ ハヴ イントロデュースト ザ カラー、"},{"t":"Or it may have confirmed an earlier expressive intention.","kana":"オール イット メイ ハヴ コンファームド アン アーリア イクスプレッシヴ インテンション、"},{"t":"We need to compare the writing, first sketch, AI-generated image and later artwork before making that claim.","kana":"ウィ ニード トゥ コンペア ザ ライティング, ファースト スケチ, エイアイ・ジェネレイティド イミジ アン レイター アートワーク ビフォー メイキング ザット クレイム、"},{"t":"With this question in mind, let me turn to the aims of the study.","kana":"ウィズ ディス クウェスチャン イン マインド, レト ミー トゥン トゥ ザ エイムズ アヴ ザ スタディ、"}]},{"title":"Slide 5 · What does this study aim to find?","image":"slides/slide-05.jpg","jp":"研究の目的は、生成AIが美術作品を良くするかどうかを判定することではありません。生徒が制作の過程でAI生成画像との関係をどのように調整したのか。そして、文章に込めた意味や表現意図に照らして、何を残し、変え、加え、手放したのかを明らかにすることです。そのため、生成画像と完成作品の見た目だけではなく、途中の記録と生徒の説明も調べます。","lines":[{"t":"This study has two aims.","kana":"ディス スタディ ハズ トゥー エイムズ、"},{"t":"First, I examine how students adjust their Distance from AI-generated images as they make art.","kana":"ファースト, アイ イグザミン ハウ スチューデンツ アジャスト ゼア ディスタンス フロム エイアイ・ジェネレイティド イミジズ アズ ゼイ メイク アート、"},{"t":"Second, I examine what they keep, change, add or reject, and why.","kana":"セカンド, アイ イグザミン ウォット ゼイ キープ, チェインジ, アド オール リジェクト, アン ワイ、"},{"t":"Their expressive intention is the reference point.","kana":"ゼア イクスプレッシヴ インテンション イズ ザ レフアンス ポイント、"},{"t":"I am not treating Distance as a simple score for how much AI a student uses.","kana":"アイ アム ノット トリーティング ディスタンス アズ ア シムパル スコール フォ ハウ マッチ エイアイ ア スチューデント ユーズィズ、"}]},{"title":"Slide 6 · Distance has two axes","image":"slides/slide-06.jpg","jp":"Distanceは、AI画像と完成作品がどれくらい似ているか、という意味だけではありません。今回、二つの軸を区別します。一つ目は、AI画像をどれだけ生成したり参照したりしたかという利用量です。二つ目は、AI画像のどの要素が、作品にどの程度残っているかという採用度です。例えば、Cはたくさん生成しても採用しない生徒、Bは1枚だけ生成してそれを生かす生徒のイメージです。この二軸を分けることで、利用量が似ていても、採用や変更の判断が異なるのかを調べます。","lines":[{"t":"Here are the two measures.","kana":"ヒール アー ザ トゥー メジュズ、"},{"t":"Amount of AI use concerns how often students generate or refer to AI-generated images.","kana":"アマウント アヴ エイアイ ユーズ カンスンズ ハウ オーファン スチューデンツ ジェネレイト オール リファー トゥ エイアイ・ジェネレイティド イミジズ、"},{"t":"Degree of adoption concerns how far elements from those images are taken into their artworks.","kana":"ディグリー アヴ アドプション カンスンズ ハウ ファル エレメンツ フロム ゾウズ イミジズ アー テイカン イントゥ ゼア アートワークス、"},{"t":"They are not the same measure.","kana":"ゼイ アー ノット ザ セイム メジュ、"},{"t":"For example, a student at C makes many images but keeps none, while a student at B makes only one image and builds on it.","kana":"フォ イグザムパル, ア スチューデント アト シー メイクス メニ イミジズ バット キープス ナン, ワイル ア スチューデント アト ビー メイクス オウンリー ワン イミジ アン ビルドズ オン イット、"},{"t":"We interpret both in relation to each student's expressive intention.","kana":"ウィ インタープレット ボウス イン リレイション トゥ イーチ スチューダントス イクスプレッシヴ インテンション、"},{"t":"This diagram is conceptual.","kana":"ディス ダイアグラム イズ カンセプチュアル、"},{"t":"It is not a plot of student results.","kana":"イット イズ ノット ア プラト アヴ スチューデント リザルトス、"}]},{"title":"Slide 7 · From classical writing to visual expression","image":"slides/slide-07.jpg","jp":"今回の実践は、国語と美術をつなぐ教科横断型の授業です。国語では『枕草子』に触れ、生徒が現代の暮らしや感覚をもとに、自分なりの文章を書きます。美術では、その文章に込めた情景、気持ち、雰囲気を、一枚の視覚作品へと表します。文章の意味を出発点にすることで、AI画像を採用した理由だけでなく、採用しなかった理由も、生徒自身の表現意図と照らして考えられるのが、この題材の特徴です。","lines":[{"t":"The unit connects Japanese language and art.","kana":"ザ ユナト カネクトス ジャパニーズ ランググワジ アン アート、"},{"t":"In language lessons, students study Makura no Soshi, a classical Japanese text.","kana":"イン ランググワジ レッスンズ, スチューデンツ スタディ マクラ ノウ ソウシ, ア クラシカル ジャパニーズ テキスト、"},{"t":"They then write their own piece about contemporary life.","kana":"ゼイ ゼン ライト ゼア オウン ピース アバウト カンテムプエリー ライフ、"},{"t":"In art lessons, they create a visual work based on that writing.","kana":"イン アート レッスンズ, ゼイ クリエイト ア ヴィジャワル ウク ベイスト オン ザット ライティング、"},{"t":"The written piece helps us understand what each student wanted to express before making decisions about AI-generated images.","kana":"ザ リトゥン ピース ヘルプス アス アンドゥスタンド ウォット イーチ スチューデント ウォーンティド トゥ イクスプレス ビフォー メイキング ディシジョンズ アバウト エイアイ・ジェネレイティド イミジズ、"}]},{"title":"Slide 8 · Six lessons with experienced AI users","image":"slides/slide-08.jpg","jp":"対象は、日本の公立中学校の第2学年、4学級、約120名です。生徒たちはそれまで約1年間、美術の授業で生成AIを利用した経験があります。今回の題材は全6時間を予定し、初めに表現したいことを整理してスケッチを描き、案を比較して制作へ進みます。後半では作品を見直し、完成後に振り返ります。したがって、新しい道具を初めて使う授業ではなく、経験のある生徒がAIを使うかどうかも含めて選び直す場面を対象にしています。","lines":[{"t":"The unit involves four classes and approximately 120 second-year students at a lower-secondary school.","kana":"ザ ユナト インヴァルヴズ フォー クラサズ アン アプラクサマトリー ワン・ハンドレッド・アンド・トゥエンティ セカンド・イル スチューデンツ アト ア ロウア・セカンダリ スクール、"},{"t":"They have around one year of earlier experience using generative AI in art.","kana":"ゼイ ハヴ アーアウンド ワン イル アヴ アーリア イクスピリーアンス ユージング ジェネラティヴ エイアイ イン アート、"},{"t":"The planned unit has six lessons, from initial writing and sketching to finishing and reflection.","kana":"ザ プランド ユナト ハズ シックス レッスンズ, フロム イニシャル ライティング アン スケチング トゥ フィニシング アン リフレクシャン、"},{"t":"This presentation reports interim findings from the early part of the unit, not the completed artworks.","kana":"ディス プレゼンテイション リポーツ インテリム ファインディングズ フロム ザ アーリ パルト アヴ ザ ユナト, ノット ザ コンプリーティド アートワークス、"}]},{"title":"Slide 9 · AI is one option, not a requirement","image":"slides/slide-09.jpg","jp":"この授業では、AIを使うことを全員に求めていません。生徒は手で描いても、AI画像を参考にしても、友人や教師と話し合ってもかまいません。AIを使わないことも、表現のための選択です。注目するのは選択肢の優劣ではなく、なぜその方法を選び、制作途中でその選び方を変えたのかという点です。これによって、AIの有無だけでは見えない表現判断を捉えたいと考えています。","lines":[{"t":"Using generative AI was optional.","kana":"ユージング ジェネラティヴ エイアイ ウォズ アプシャナル、"},{"t":"Students could draw by hand, look at AI-generated images, or talk with teachers and classmates.","kana":"スチューデンツ クッド ドロー バイ ハンド, ルク アト エイアイ・ジェネレイティド イミジズ, オール トーク ウィズ ティーチュズ アン クラスメイトス、"},{"t":"They could also change their approach during the unit.","kana":"ゼイ クッド オールソウ チェインジ ゼア アプロウチ ドゥリング ザ ユナト、"},{"t":"I am interested in why students chose these methods.","kana":"アイ アム イントラスティド イン ワイ スチューデンツ チョウズ ジーズ メサドズ、"},{"t":"Using AI, or deciding not to use it, cannot by itself tell us the quality of their artistic decisions.","kana":"ユージング エイアイ, オール ディサイディング ノット トゥ ユーズ イット, キャノット バイ イトセルフ テル アス ザ クワラティー アヴ ゼア アルティスティク ディシジョンズ、"}]},{"title":"Slide 10 · Intention comes before the AI image","image":"slides/slide-10.jpg","jp":"国語の授業で書いた文章や、最初のアイデアスケッチには、AI生成画像を見る前に、生徒が表そうとしていたことが残されています。その後のAI画像、描き直したスケッチ、制作途中の作品と比べれば、何が残り、何が変わったかを追えます。とくに、AI画像から取り入れたように見える要素が、もともと生徒の構想にあったものなのかを見分けることが重要です。見た目が似ているだけで、AIが発想の原因だったとは判断しません。","lines":[{"t":"We start with the student's own writing and first sketch.","kana":"ウィ スタルト ウィズ ザ スチューダントス オウン ライティング アン ファースト スケチ、"},{"t":"These record an initial expressive intention before AI-generated images were used in this unit.","kana":"ジーズ ラコールド アン イニシャル イクスプレッシヴ インテンション ビフォー エイアイ・ジェネレイティド イミジズ ワー ユーズド イン ディス ユナト、"},{"t":"We then compare later sketches, generated images and developing artwork.","kana":"ウィ ゼン コンペア レイター スケチャズ, ジェネレイティド イミジズ アン ディヴェラピング アートワーク、"},{"t":"This matters because a colour or composition seen in an AI image may already have been part of the student's original idea.","kana":"ディス マトゥズ ビコーズ ア カラー オール カムパジシャン シーン イン アン エイアイ イミジ メイ オールレディ ハヴ ビン パルト アヴ ザ スチューダントス アーイジャナル アイディーア、"}]},{"title":"Slide 11 · CAPGAP: a lens from earlier research","image":"slides/slide-11.jpg","jp":"ここで、これまでの研究との関係を簡単に説明します。私たちは、AIとの制作中に生じるズレを、CAPGAPという枠組みで考えてきました。認知的なズレは、考えや構成を見直すことです。情意的なズレは、驚きや違和感などの感情です。対話的なズレは、AIや他者との関わりによって判断が動くことです。ただし、今回の研究で中心となるのは、この三分類そのものではなく、画像とのDistanceを生徒がどう調整したかです。","lines":[{"t":"CAPGAP comes from our previous research.","kana":"キャップギャップ カムズ フロム アウア プリーヴィアス リサーチ、"},{"t":"It considers three kinds of gap: Cognitive, Affective and Participatory.","kana":"イット カンシドゥズ スリー カインドズ アヴ ガプ： カグニティヴ, アフェクティヴ アン パルティサパトーリー、"},{"t":"These concern thinking, feelings and interaction with AI or other people.","kana":"ジーズ カンスン シンキング, フィーリングズ アン インタラクション ウィズ エイアイ オール アザー ピーパル、"},{"t":"CAPGAP can help us interpret why a choice changes.","kana":"キャップギャップ キャン ヘルプ アス インタープレット ワイ ア チョイス チェインジズ、"},{"t":"In this presentation, however, the main focus is Distance, not testing the CAPGAP framework itself.","kana":"イン ディス プレゼンテイション, ハウエヴ, ザ メイン フォウカス イズ ディスタンス, ノット テスティング ザ キャップギャップ フレイムワーク イトセルフ、"}]},{"title":"Slide 12 · CSRI helps us read process traces","image":"slides/slide-12.jpg","jp":"これまでの別の研究では、画像を比べる、選ぶ、見直す、もう一度試す、という行為をCSRIと整理しました。これは、すべての生徒が必ず同じ順番で進むという意味ではありません。制作記録の中に現れた判断を読み取るための視点です。今回も、プロンプトや画像、スケッチ、短い振り返りを組み合わせ、生徒がAI案を受け入れた場面と、そこから離れた場面を見取る手がかりにします。前の研究では、CSRIで「AIの候補画像の中からどれを選んだか」をたどりました。今回は、その問いを「自分の作品に何を取り込んだか」へ広げます。","lines":[{"t":"We also use CSRI to read process records.","kana":"ウィ オールソウ ユーズ シー・エス・アール・アイ トゥ レド プロセス レコーズ、"},{"t":"The letters stand for Compare, Select, Review and Iterate.","kana":"ザ レトゥズ スタンド フォ コンペア, セレクト, リヴュー アン イタレイト、"},{"t":"Students may compare images, choose an option, reconsider it, and try again.","kana":"スチューデンツ メイ コンペア イミジズ, チュズ アン アプシャン, リーカンシドゥ イット, アン トライ アゲン、"},{"t":"CSRI is an analytical way to read their decisions.","kana":"シー・エス・アール・アイ イズ アン アナリティカル ウェイ トゥ レド ゼア ディシジョンズ、"},{"t":"It is not a fixed sequence that every student followed or that we fully observed in every case.","kana":"イット イズ ノット ア フィクスト シークワンス ザット エヴイー スチューデント ファロウド オール ザット ウィ フリー アブズヴド イン エヴイー ケイス、"},{"t":"In our earlier study, CSRI traced how students chose among AI variants.","kana":"イン アウア アーリア スタディ, シー・エス・アール・アイ トレイスト ハウ スチューデンツ チョウズ アマング エイアイ ヴェリーアントス、"},{"t":"Here, we extend the question to what they carry into their own artwork.","kana":"ヒール, ウィ イクステンド ザ クウェスチャン トゥ ウォット ゼイ カリー イントゥ ゼア オウン アートワーク、"}]},{"title":"Slide 13 · Compare   ·   Select   ·   Review   ·   Iterate","image":"slides/slide-13.jpg","jp":"ここで、授業で用いたCanvaの操作をご覧ください。言葉を入力すると複数の画像案が提示されます。生徒はそれを比較し、使いたい部分や違和感のある部分を考えます。もう一度生成する場合もあれば、描くことに戻る場合もあります。動画では、画像がつくられる回数だけでなく、その後にどのような選択が起こり得るのかに注目してください。","lines":[{"t":"Please watch this short demonstration of Canva.","kana":"プリーズ ワチ ディス ショールト デマンストレイシャン アヴ クアンヴア、"},{"t":"A prompt can produce several image options.","kana":"ア プラムプト キャン プラジュース セヴラル イミジ アプシャンズ、"},{"t":"The important part is what happens after the images appear: looking, comparing, choosing and possibly revising.","kana":"ザ インポータント パルト イズ ウォット ハパンズ アフター ザ イミジズ アピア： ルキング, カムペリング, チュジング アン パサブリー リヴァイジング、"},{"t":"This is a screen demonstration, not a recorded case from the student data.","kana":"ディス イズ ア スクリーン デマンストレイシャン, ノット ア リコーディド ケイス フロム ザ スチューデント デイタ、"},{"t":"It simply shows the kinds of decisions we want to investigate.","kana":"イット シムプリー ショウズ ザ カインドズ アヴ ディシジョンズ ウィ ワント トゥ インヴェスタゲイト、"}]},{"title":"Slide 14 · What records do we have?","image":"slides/slide-14.jpg","jp":"文章、スケッチ、AI画像、制作途中の作品、2回のアンケートを収集しました。ID・学級・出席番号がすべて一致した68人を2時点で照合でき、以降の数字はすべてこの68人を分母にしています。提出件数は補足資料A1に示しました。","lines":[{"t":"We collected essays, sketches, AI-generated images, developing artworks and two questionnaires.","kana":"ウィ カレクタド エセイズ, スケチャズ, エイアイ・ジェネレイティド イミジズ, ディヴェラピング アートワークス アン トゥー クウェスチャネルズ、"},{"t":"By checking student ID, class and seat number, we matched 68 students across both surveys.","kana":"バイ チェキング スチューデント アイ・ディー, クラス アン シート ナンバー, ウィ マッチト シクスティ・エイト スチューデンツ アクロス ボウス スヴェイズ、"},{"t":"All the figures that follow use these 68 students as the denominator.","kana":"オール ザ フィグユズ ザット ファロウ ユーズ ジーズ シクスティ・エイト スチューデンツ アズ ザ ディナマネイトゥ、"},{"t":"Submission counts are shown in the appendix.","kana":"サブミシャン カウンツ アー ショウン イン ザ アペンディクス、"}]},{"title":"Slide 15 · Zero new images does not mean no AI use","image":"slides/slide-15.jpg","jp":"②の生成回数0回は、②の授業内で新しく画像を作らなかったという意味です。①で作った画像をもとに作品を進めている可能性があります。また①の生成回数の空欄には、授業時間が足りずAI使用まで進まなかったケースが含まれる可能性があります。ただし、時間不足の理由は質問紙で直接測っていないので、断定はしません。","lines":[{"t":"A zero in Survey 2 means that no new AI-generated images were reported in that lesson.","kana":"ア ズィーロウ イン サーヴェイ トゥー ミーンズ ザット ノウ ニュー エイアイ・ジェネレイティド イミジズ ワー リポーティド イン ザット レッスン、"},{"t":"It does not mean the student never used AI.","kana":"イット ダズ ノット ミーン ザ スチューデント ネヴ ユーズド エイアイ、"},{"t":"They may have used an earlier image, or spent the lesson drawing and developing their work.","kana":"ゼイ メイ ハヴ ユーズド アン アーリア イミジ, オール スペント ザ レッスン ドローイング アン ディヴェラピング ゼア ウク、"},{"t":"Some blank answers in Survey 1 may mean that students had not yet reached image generation.","kana":"サム ブラングク アンスズ イン サーヴェイ ワン メイ ミーン ザット スチューデンツ ハド ノット イェト リーチト イミジ ジェネレイション、"},{"t":"We cannot confirm the reason from the counts alone.","kana":"ウィ キャノット コンファーム ザ リーズン フロム ザ カウンツ アロウン、"}]},{"title":"Slide 16 · Two relationships to investigate","image":"slides/slide-16.jpg","jp":"研究では、①②のどこかでAIを使用したかという単元レベルの判定と、各授業の新規生成回数を区別します。また、AI画像の利用・参照と、作品に要素を採用したかは別指標です。①での未記録や②の0回の理由は本人の記述、生成履歴、作品の経過から検証します。","lines":[{"t":"We therefore investigate two relationships.","kana":"ウィ ゼルフォール インヴェスタゲイト トゥー リレイションシップス、"},{"t":"First, does reported AI use relate to the degree of adoption?","kana":"ファースト, ダズ リポーティド エイアイ ユーズ リレイト トゥ ザ ディグリー アヴ アドプション？"},{"t":"Second, why do new-generation counts differ between lessons?","kana":"セカンド, ワイ ドゥー ニュー・ジェネレイション カウンツ ディフ ビトウィーン レッスンズ？"},{"t":"A student may not have reached the activity, may already have a suitable image, or may prefer another method.","kana":"ア スチューデント メイ ノット ハヴ リーチト ザ アクティヴァティー, メイ オールレディ ハヴ ア シュータバル イミジ, オール メイ プラフ アナザー メソッド、"},{"t":"These are possible explanations, not findings about individual motives.","kana":"ジーズ アー ポッシブル エクスプラネイシャンズ, ノット ファインディングズ アバウト インダヴィジャワル モウティヴズ、"},{"t":"We need matched records and students' reasons.","kana":"ウィ ニード マッチト レコーズ アン スチューデンツ' リーズンズ、"}]},{"title":"Slide 17 · Who used AI across the two lessons?","image":"slides/slide-17.jpg","jp":"ID・学級・番号で照合できた68人のうち、①または②で生成を確認できたのは45人です。生成回数の記録がなくても、②で画像の参照や採用を報告した8人を含め、AI使用ありは53人です。この53人の中には、①で生成回数の記録がなく②で初めて生成した5人が含まれます（53＋15＝68）。残る15人は「使用未確認」であり、積極的に使用を避けた生徒とは判断しません。","lines":[{"t":"Among 68 verified pairs, 45 students reported generating AI images in at least one lesson.","kana":"アマング シクスティ・エイト ヴェリファイド ペアズ, フォーティ・ファイヴ スチューデンツ リポーティド ジェネレイティング エイアイ イミジズ イン アト リースト ワン レッスン、"},{"t":"Another eight reported referring to or adopting AI-generated images in Survey 2, although generation was not recorded.","kana":"アナザー エイト リポーティド リファーリング トゥ オール アドプティング エイアイ・ジェネレイティド イミジズ イン サーヴェイ トゥー, オールゾウ ジェネレイション ウォズ ノット リコーディド、"},{"t":"This gives 53 students with evidence of AI use.","kana":"ディス ギヴズ フィフティ・スリー スチューデンツ ウィズ エヴィデンス アヴ エイアイ ユーズ、"},{"t":"Five of these 53 have no Survey 1 generation count and first appear as generators in Survey 2, so they are part of the 53, not an extra group.","kana":"ファイヴ アヴ ジーズ フィフティ・スリー ハヴ ノウ サーヴェイ ワン ジェネレイション カウント アン ファースト アピア アズ ジェネレイターズ イン サーヴェイ トゥー, ソウ ゼイ アー パルト アヴ ザ フィフティ・スリー, ノット アン エクストラ グルプ、"},{"t":"Fifty-three plus fifteen makes sixty-eight.","kana":"フィフティ・スリー プラス フィフティーン メイクス シクスティ・エイト、"},{"t":"For the other 15, use is not confirmed.","kana":"フォ ザ アザー フィフティーン, ユーズ イズ ノット コンファームド、"},{"t":"It would be incorrect to call them deliberate non-users.","kana":"イット ウッド ビー インクエクト トゥ コール ゼム ディリブアト ノン・ユーザーズ、"}]},{"title":"Slide 18 · Zero new images in lesson 2 can still mean AI use","image":"slides/slide-18.jpg","jp":"照合済み68人の中で、①では画像生成を行い、②では新規生成0回だった生徒は19人です。もちろん19人全員を「AI使用あり」と分類します。このうち12人は作品への要素採用、さらに3人は作品への採用はしないが参照したと報告しています。","lines":[{"t":"Nineteen matched students generated images in Survey 1 but reported zero new images in Survey 2.","kana":"ナインティーン マッチト スチューデンツ ジェネレイティド イミジズ イン サーヴェイ ワン バット リポーティド ズィーロウ ニュー イミジズ イン サーヴェイ トゥー、"},{"t":"All nineteen are classified as having used AI during the unit.","kana":"オール ナインティーン アー クラサファイド アズ ハヴィング ユーズド エイアイ ドゥリング ザ ユナト、"},{"t":"Twelve also reported adopting AI-generated elements in their developing artwork, and three reported reference without adoption.","kana":"トウェルヴ オールソウ リポーティド アドプティング エイアイ・ジェネレイティド エレメンツ イン ゼア ディヴェラピング アートワーク, アン スリー リポーティド レフアンス ウィザウト アドプション、"},{"t":"The survey does not tell us why they stopped generating new images.","kana":"ザ サーヴェイ ダズ ノット テル アス ワイ ゼイ スタプト ジェネレイティング ニュー イミジズ、"},{"t":"That question needs further evidence.","kana":"ザット クウェスチャン ニードズ フズ エヴィデンス、"}]},{"title":"Slide 19 · Limits of this interim analysis","image":"slides/slide-19.jpg","jp":"本研究は1校の実践です。①の生成回数には空欄があり、授業の進度や回答漏れなどが考えられます。②の一部の提出は照合に確認が必要です（件数は補足資料A1）。①で未記録、②で0回という記録だけでは、AI使用を自ら拒否したとは言えません。生成履歴や完成作品との対応づけが今後必要です。","lines":[{"t":"These findings have limits.","kana":"ジーズ ファインディングズ ハヴ リミッツ、"},{"t":"The data come from one school, and the students had previous experience of AI.","kana":"ザ デイタ カム フロム ワン スクール, アン ザ スチューデンツ ハド プリーヴィアス イクスピリーアンス アヴ エイアイ、"},{"t":"Some Survey 1 submissions had no recorded generation count, and a few Survey 2 submissions still need a secure match.","kana":"サム サーヴェイ ワン サブミシャンズ ハド ノウ リコーディド ジェネレイション カウント, アン ア フュー サーヴェイ トゥー サブミシャンズ スティル ニード ア シクユル マッチ、"},{"t":"The exact figures are in the appendix.","kana":"ザ イグザクト フィグユズ アー イン ザ アペンディクス、"},{"t":"Students' answers may also be influenced by the teacher-researcher setting.","kana":"スチューデンツ' アンスズ メイ オールソウ ビー インフルアンスト バイ ザ ティーチャー・リサーチャー セティング、"},{"t":"We cannot infer learning gains or a deliberate decision not to use AI from these interim data.","kana":"ウィ キャノット インフ ルニング ゲインズ オール ア ディリブアト ディシジョン ノット トゥ ユーズ エイアイ フロム ジーズ インテリム デイタ、"}]},{"title":"Slide 20 · What could teachers assess?","image":"slides/slide-20.jpg","jp":"教師が見取りたいのは、使った回数ではなく、表現の意図、残す・変える・手放すという判断、その理由です。再生成をやめた行動にも判断が表れている可能性があります。ただし、0回という数値だけで学びの質を評価することは避けます。生徒の理由と制作経過を合わせて確認する形成的評価につなげます。","lines":[{"t":"What might teachers assess?","kana":"ウォット マイト ティーチュズ アセス？"},{"t":"I suggest three questions.","kana":"アイ サジェスト スリー クウェスチャンズ、"},{"t":"What did the student want to express?","kana":"ウォット ディド ザ スチューデント ワント トゥ イクスプレス？"},{"t":"Which elements did they keep, adapt or reject?","kana":"ウィッチ エレメンツ ディド ゼイ キープ, アダプト オール リジェクト？"},{"t":"And why?","kana":"アン ワイ？"},{"t":"These questions connect expressive intention with the degree of adoption.","kana":"ジーズ クウェスチャンズ カネクト イクスプレッシヴ インテンション ウィズ ザ ディグリー アヴ アドプション、"},{"t":"They may support formative assessment, but image-generation counts alone cannot show whether a student's decision was thoughtful or effective.","kana":"ゼイ メイ サポート フォールマティヴ アセスマント, バット イミジ・ジェネレイション カウンツ アロウン キャノット ショウ ウェズ ア スチューダントス ディシジョン ウォズ ソートファル オール イフェクティヴ、"}]},{"title":"Slide 21 · Next: trace when, how, and why students use AI","image":"slides/slide-21.jpg","jp":"③と完成作品を加え、①②のどこで生成したか、前の画像を活用したか、採用した要素と理由を見ます。追加質問では「まだ生成に取りかかる時間がなかった」「前の画像で十分だった」「前の画像を使い続けた」「手描きを選んだ」「AIを使用しないと判断した」などを区別できるようにしたいです。","lines":[{"t":"The next stage will add Survey 3 and the completed artworks.","kana":"ザ ネクスト ステイジ ウィル アド サーヴェイ スリー アン ザ コンプリーティド アートワークス、"},{"t":"We will compare the writing, early sketches, AI-generated images and later decisions.","kana":"ウィ ウィル コンペア ザ ライティング, アーリ スケチャズ, エイアイ・ジェネレイティド イミジズ アン レイター ディシジョンズ、"},{"t":"We also need to ask why a student did not generate again.","kana":"ウィ オールソウ ニード トゥ アスク ワイ ア スチューデント ディド ノット ジェネレイト アゲン、"},{"t":"Was there insufficient time?","kana":"ウォズ ゼア インサフィシャント タイム？"},{"t":"Was an earlier image already suitable?","kana":"ウォズ アン アーリア イミジ オールレディ シュータバル？"},{"t":"Did the student choose to draw?","kana":"ディド ザ スチューデント チュズ トゥ ドロー？"},{"t":"The current records cannot distinguish these reasons reliably.","kana":"ザ クアント レコーズ キャノット ディスティンググウィシュ ジーズ リーズンズ リライアブリー、"}]},{"title":"Slide 22 · Distance concerns decisions, not a single generation count.","image":"slides/slide-22.jpg","jp":"結論です。①または②のいずれかでAIを使用した生徒は、単元全体では使用ありと分類します。②で新しく生成しなかったからといって、①での使用は消えません。Distanceとして捉えたいのは、画像を何回生成したかだけでなく、生徒が自分の意図に照らして何を残し、何を変え、何を手放したかという判断です。","lines":[{"t":"To conclude, Distance is not a ranking of students and not a score for dependence on AI.","kana":"トゥ コンクルード, ディスタンス イズ ノット ア ラングキング アヴ スチューデンツ アン ノット ア スコール フォ ディペンデンス オン エイアイ、"},{"t":"It concerns how students use, adopt, adapt or set aside AI-generated suggestions in relation to their expressive intentions.","kana":"イット カンスンズ ハウ スチューデンツ ユーズ, アドプト, アダプト オール セト アサイド エイアイ・ジェネレイティド サジェスチョンズ イン リレイション トゥ ゼア イクスプレッシヴ インテンションズ、"},{"t":"A student who generated images in the first lesson remains an AI user, even with zero new images in the second.","kana":"ア スチューデント フー ジェネレイティド イミジズ イン ザ ファースト レッスン リメインズ アン エイアイ ユーザー, イーヴン ウィズ ズィーロウ ニュー イミジズ イン ザ セカンド、"},{"t":"Thank you very much.","kana":"サンク ユー ヴェリ マッチ、"}]},{"title":"Slide A1 · Appendix A1: Submission counts","image":"slides/slide-23.jpg","jp":"アンケート①98件、②77件の提出があり、重複を含みます。ID、学級、出席番号の一致を確認したうえで、68人を2時点で照合できました。②の7提出は照合に確認が必要です。質問紙の提出件数と2時点照合済み人数を区別して発表します。","lines":[{"t":"We collected essays, sketches, AI-generated images, developing artworks and questionnaires.","kana":"ウィ カレクタド エセイズ, スケチャズ, エイアイ・ジェネレイティド イミジズ, ディヴェラピング アートワークス アン クウェスチャネルズ、"},{"t":"Survey 1 had 98 submissions, and Survey 2 had 77.","kana":"サーヴェイ ワン ハド ナインティ・エイト サブミシャンズ, アン サーヴェイ トゥー ハド セヴンティ・セヴン、"},{"t":"After checking student ID, class and seat number, we verified 68 paired student records.","kana":"アフター チェキング スチューデント アイ・ディー, クラス アン シート ナンバー, ウィ ヴェリファイド シクスティ・エイト ペルド スチューデント レコーズ、"},{"t":"Seven Survey 2 submissions still need checking.","kana":"セヴァン サーヴェイ トゥー サブミシャンズ スティル ニード チェキング、"},{"t":"The number of submissions must not be confused with the number of matched students.","kana":"ザ ナンバー アヴ サブミシャンズ マスト ノット ビー カンフユズド ウィズ ザ ナンバー アヴ マッチト スチューデンツ、"}]},{"title":"Slide A2 · Appendix A2: Not yet used is not opting out","image":"slides/slide-24.jpg","jp":"①で「AIは使っていない／使わない予定」を選択したのは有効回答93件中25件です。しかし、IDで厳密に対応させると、この選択肢を選んだ生徒のうち4人は②でAI画像を生成しています。したがって①の回答のみで「AIを使用しないことを選択した」と判断してはいけません。授業進行上、まだ画像生成に取りかかれなかった可能性もあります。","lines":[{"t":"In Survey 1, 25 out of 93 valid responses selected an option combining 'I have not used AI' with 'I do not plan to use it'.","kana":"イン サーヴェイ ワン, トゥエンティ・ファイヴ アウト アヴ ナインティ・スリー ヴァリド リスポンシズ セレクティド アン アプシャン カムバイニング 'アイ ハヴ ノット ユーズド エイアイ' ウィズ 'アイ ドゥー ノット プラン トゥ ユーズ イット'、"},{"t":"These are two different meanings.","kana":"ジーズ アー トゥー ディファレント ミーニングズ、"},{"t":"Among the verified paired records, at least four of those students went on to generate images in Survey 2.","kana":"アマング ザ ヴェリファイド ペルド レコーズ, アト リースト フォー アヴ ゾウズ スチューデンツ ウェント オン トゥ ジェネレイト イミジズ イン サーヴェイ トゥー、"},{"t":"So their first response is not evidence that they chose to avoid AI throughout the unit.","kana":"ソウ ゼア ファースト リスポンス イズ ノット エヴィデンス ザット ゼイ チョウズ トゥ アヴォイド エイアイ スルーアウト ザ ユナト、"}]}];
  const QA_SECTIONS = [{"title":"Slide 1 · Students use AI, but they make the decisions","image":"slides/slide-01.jpg","jp":"みなさん、こんにちは。私は日本の公立中学校で美術を教えながら、生成AIを用いた美術教育を研究しています。今日のテーマは、生成AIとの「Distance」、つまり距離の取り方です。AI画像を作品に生かす生徒もいれば、一度試したあとに手描きを選ぶ生徒もいます。その違いを、単に「AIを使ったかどうか」で捉えてよいのでしょうか。","lines":[{"t":"This presentation examines Distance as a relationship students adjust during generative-AI-supported art making.","kana":"ディス プレゼンテイション イグザマンズ ディスタンス アズ ア リレイションシップ スチューデンツ アジャスト ドゥリング ジェネラティヴ・エイアイ・サポーティド アート メイキング、"},{"t":"The focus is not simply whether they use AI, but how they respond to generated proposals in relation to their expressive intentions.","kana":"ザ フォウカス イズ ノット シムプリー ウェズ ゼイ ユーズ エイアイ, バット ハウ ゼイ リスポンド トゥ ジェネレイティド プラポウザルズ イン リレイション トゥ ゼア イクスプレッシヴ インテンションズ、"},{"t":"These judgements remain central to the creative process.","kana":"ジーズ ジャジマントス リメイン セントラル トゥ ザ クリエイティヴ プロセス、"}]},{"title":"Slide 2 · AI use does not tell the whole story","image":"slides/slide-02.jpg","jp":"生成AIは、短時間で整った画像をつくれます。しかし、たくさん画像を生成したからといって、その画像を作品に採用したとは限りません。反対に、生成回数が少なくても、前の授業で見た画像が作品に影響しているかもしれません。本研究では、AI画像との関わりを「使った量」だけで判断せず、生徒がその提案をどう受け止め、表現に組み直したかを明らかにしたいと考えています。","lines":[{"t":"The amount of AI use and the degree of adoption are conceptually distinct.","kana":"ザ アマウント アヴ エイアイ ユーズ アン ザ ディグリー アヴ アドプション アー カンセプチュアリー ディスティングクト、"},{"t":"Image generation may produce many options without any of their elements being retained.","kana":"イミジ ジェネレイション メイ プラジュース メニ アプシャンズ ウィザウト エニー アヴ ゼア エレメンツ ビーイング リテインド、"},{"t":"Conversely, a previously generated image may continue to inform the artwork without further generation.","kana":"カンヴスリー, ア プリーヴィーアスリー ジェネレイティド イミジ メイ カンティンユ トゥ インフォーム ザ アートワーク ウィザウト フズ ジェネレイション、"},{"t":"Student decisions therefore require a process-based interpretation.","kana":"スチューデント ディシジョンズ ゼルフォール リークワイアー ア プロセス・ベイスト イントゥプリテイシャン、"}]},{"title":"Slide 3 · Student responses suggest several paths","image":"slides/slide-03.jpg","jp":"方法の説明に入る前に、生徒の声を三つ紹介します。自由記述に、②で0回と答えた生徒の異なる理由が示されています。「AIの画像が思っている感じのものだったから」と答えた生徒は、すでに十分な画像があった可能性を示します。また「桜の木を一つだけにしたこと、残したところは花びらの散り方」と書いた生徒は、AI案を参照しつつ変更しています。一方「プロンプトが難しくて、自分で考えて書いたほうが簡単だと思った」と回答した生徒もいました。スライドは英訳と要約で、原文の全訳ではありません。満足、選択的活用、方法の変更という多様な動機を示す例ですが、個別の制作記録で追認する必要があります。","lines":[{"t":"The translated, shortened responses illustrate distinct reported relationships with generated proposals: satisfaction with an image, selective adaptation of its elements and a preference for hand drawing.","kana":"ザ トランズレイティド, ショールタンド リスポンシズ イラストレイト ディスティングクト リポーティド リレイションシップス ウィズ ジェネレイティド プラポウザルズ： サティスファクション ウィズ アン イミジ, サレクティヴ アダプテイション アヴ イトス エレメンツ アン ア プレフアンス フォ ハンド ドローイング、"},{"t":"Each respondent reported zero new generation in Survey 2.","kana":"イーチ リスパンダント リポーティド ズィーロウ ニュー ジェネレイション イン サーヴェイ トゥー、"},{"t":"These cases illuminate possible interpretations but cannot establish a population-wide pattern or causal explanation.","kana":"ジーズ ケイサズ イルミニト ポッシブル イントゥプリテイシャンズ バット キャノット イスタブリシュ ア パプヤレイシャン・ワイド パトゥン オール コーザル エクスプラネイシャン、"}]},{"title":"Slide 4 · Where did the orange idea begin?","image":"slides/slide-04.jpg","jp":"②には「オレンジのきれいな背景は残しました」「オレンジの色が想像していた色にぴったりだったから」という回答があります。これは、AI画像から新しい色の発想を得たのか、AI画像がもともとのイメージを確かめる材料となったのかを区別する必要がある例です。文章と最初のスケッチ、AI画像、作品を時系列に比べることが重要です。この問いを念頭に置いて、研究の目的に進みます。","lines":[{"t":"The reported retention of an orange background that matched the student's imagined colour raises a question of temporal origin.","kana":"ザ リポーティド リーテンシャン アヴ アン オレンジ バクグラウンド ザット マッチト ザ スチューダントス イマジンド カラー レイザズ ア クウェスチャン アヴ テムプアル オーラジャン、"},{"t":"AI may have supplied a new proposal or affirmed a pre-existing intention.","kana":"エイアイ メイ ハヴ サプライド ア ニュー プラポウザル オール アフムド ア プリー・イグジスティング インテンション、"},{"t":"Only cross-referencing the written text, initial sketch, generated output and developing artwork could help distinguish these accounts.","kana":"オウンリー クロース・レフアンシング ザ リトゥン テキスト, イニシャル スケチ, ジェネレイティド アウトプト アン ディヴェラピング アートワーク クッド ヘルプ ディスティンググウィシュ ジーズ アカウントス、"}]},{"title":"Slide 5 · What does this study aim to find?","image":"slides/slide-05.jpg","jp":"研究の目的は、生成AIが美術作品を良くするかどうかを判定することではありません。生徒が制作の過程でAI生成画像との関係をどのように調整したのか。そして、文章に込めた意味や表現意図に照らして、何を残し、変え、加え、手放したのかを明らかにすることです。そのため、生成画像と完成作品の見た目だけではなく、途中の記録と生徒の説明も調べます。","lines":[{"t":"The first research aim is to trace adjustments in Distance from AI-generated images.","kana":"ザ ファースト リサーチ エイム イズ トゥ トレイス アジャストマントス イン ディスタンス フロム エイアイ・ジェネレイティド イミジズ、"},{"t":"The second is to examine decisions to retain, modify, combine, develop or reject generated elements and the reasons given.","kana":"ザ セカンド イズ トゥ イグザミン ディシジョンズ トゥ リテイン, マダファイ, カムバイン, ディヴェラプ オール リジェクト ジェネレイティド エレメンツ アン ザ リーズンズ ギヴァン、"},{"t":"Expressive intention provides the interpretive reference point for those decisions.","kana":"イクスプレッシヴ インテンション プラヴァイドズ ザ イントゥプラティヴ レフアンス ポイント フォ ゾウズ ディシジョンズ、"}]},{"title":"Slide 6 · Distance has two axes","image":"slides/slide-06.jpg","jp":"Distanceは、AI画像と完成作品がどれくらい似ているか、という意味だけではありません。今回、二つの軸を区別します。一つ目は、AI画像をどれだけ生成したり参照したりしたかという利用量です。二つ目は、AI画像のどの要素が、作品にどの程度残っているかという採用度です。例えば、Cはたくさん生成しても採用しない生徒、Bは1枚だけ生成してそれを生かす生徒のイメージです。この二軸を分けることで、利用量が似ていても、採用や変更の判断が異なるのかを調べます。","lines":[{"t":"Distance is examined through amount of AI use and degree of adoption, interpreted against expressive intention.","kana":"ディスタンス イズ イグザマンド スルー アマウント アヴ エイアイ ユーズ アン ディグリー アヴ アドプション, インタープレティド アゲンスト イクスプレッシヴ インテンション、"},{"t":"Amount of use includes generation and reference, while degree of adoption concerns what is carried into the artwork.","kana":"アマウント アヴ ユーズ インクルドズ ジェネレイション アン レフアンス, ワイル ディグリー アヴ アドプション カンスンズ ウォット イズ カリード イントゥ ザ アートワーク、"},{"t":"The two-axis diagram illustrates an analytical distinction, not observed cases or a validated composite scale.","kana":"ザ トゥー・アクサス ダイアグラム イラストレイトス アン アナリティカル ディスティングクシャン, ノット アブズヴド ケイサズ オール ア ヴァラデイティド カムパザト スケイル、"}]},{"title":"Slide 7 · From classical writing to visual expression","image":"slides/slide-07.jpg","jp":"今回の実践は、国語と美術をつなぐ教科横断型の授業です。国語では『枕草子』に触れ、生徒が現代の暮らしや感覚をもとに、自分なりの文章を書きます。美術では、その文章に込めた情景、気持ち、雰囲気を、一枚の視覚作品へと表します。文章の意味を出発点にすることで、AI画像を採用した理由だけでなく、採用しなかった理由も、生徒自身の表現意図と照らして考えられるのが、この題材の特徴です。","lines":[{"t":"This cross-curricular unit links classical Japanese writing with visual expression.","kana":"ディス クロース・クイクヤル ユナト リングクス クラシカル ジャパニーズ ライティング ウィズ ヴィジャワル イクスプレシャン、"},{"t":"Students interpret Makura no Soshi, compose a contemporary personal text, and develop a visual artwork from it.","kana":"スチューデンツ インタープレット マクラ ノウ ソウシ, カムポウズ ア カンテムプエリー プシナル テキスト, アン ディヴェラプ ア ヴィジャワル アートワーク フロム イット、"},{"t":"The text provides an earlier statement of expressive intention against which the role of AI-generated images can be examined.","kana":"ザ テキスト プラヴァイドズ アン アーリア ステイトマント アヴ イクスプレッシヴ インテンション アゲンスト ウィッチ ザ ロウル アヴ エイアイ・ジェネレイティド イミジズ キャン ビー イグザマンド、"}]},{"title":"Slide 8 · Six lessons with experienced AI users","image":"slides/slide-08.jpg","jp":"対象は、日本の公立中学校の第2学年、4学級、約120名です。生徒たちはそれまで約1年間、美術の授業で生成AIを利用した経験があります。今回の題材は全6時間を予定し、初めに表現したいことを整理してスケッチを描き、案を比較して制作へ進みます。後半では作品を見直し、完成後に振り返ります。したがって、新しい道具を初めて使う授業ではなく、経験のある生徒がAIを使うかどうかも含めて選び直す場面を対象にしています。","lines":[{"t":"The setting is a six-lesson unit involving approximately 120 experienced AI users across four lower-secondary classes.","kana":"ザ セティング イズ ア シックス・レッスン ユナト インヴァルヴィング アプラクサマトリー ワン・ハンドレッド・アンド・トゥエンティ イクスピリーアンスト エイアイ ユーザーズ アクロス フォー ロウア・セカンダリ クラサズ、"},{"t":"The present analysis draws on the early stages of the unit.","kana":"ザ プレザント アナリシス ドローズ オン ザ アーリ ステイジャズ アヴ ザ ユナト、"},{"t":"It should not be presented as a finished-work analysis or as evidence of changes across the entire six-lesson sequence.","kana":"イット シュッド ノット ビー プリーゼンティド アズ ア フィニシュト・ウク アナリシス オール アズ エヴィデンス アヴ チェインジズ アクロス ザ インタイアー シックス・レッスン シークワンス、"}]},{"title":"Slide 9 · AI is one option, not a requirement","image":"slides/slide-09.jpg","jp":"この授業では、AIを使うことを全員に求めていません。生徒は手で描いても、AI画像を参考にしても、友人や教師と話し合ってもかまいません。AIを使わないことも、表現のための選択です。注目するのは選択肢の優劣ではなく、なぜその方法を選び、制作途中でその選び方を変えたのかという点です。これによって、AIの有無だけでは見えない表現判断を捉えたいと考えています。","lines":[{"t":"AI use was available but not compulsory.","kana":"エイアイ ユーズ ウォズ アヴェイラバル バット ノット カムパルスイー、"},{"t":"Students could draw, consult AI-generated images or discuss their ideas with others.","kana":"スチューデンツ クッド ドロー, カンサルト エイアイ・ジェネレイティド イミジズ オール ディスカス ゼア アイディーアズ ウィズ アザーズ、"},{"t":"This choice-based design enables us to observe different modes of engagement, although the method chosen cannot on its own establish the quality or autonomy of the resulting artistic judgement.","kana":"ディス チョイス・ベイスト ディザイン エネイバルズ アス トゥ アブズヴ ディファレント モウドズ アヴ エンゲイジマント, オールゾウ ザ メソッド チョウザン キャノット オン イトス オウン イスタブリシュ ザ クワラティー オール オータナミー アヴ ザ リザルティング アルティスティク ジャジマント、"}]},{"title":"Slide 10 · Intention comes before the AI image","image":"slides/slide-10.jpg","jp":"国語の授業で書いた文章や、最初のアイデアスケッチには、AI生成画像を見る前に、生徒が表そうとしていたことが残されています。その後のAI画像、描き直したスケッチ、制作途中の作品と比べれば、何が残り、何が変わったかを追えます。とくに、AI画像から取り入れたように見える要素が、もともと生徒の構想にあったものなのかを見分けることが重要です。見た目が似ているだけで、AIが発想の原因だったとは判断しません。","lines":[{"t":"The essay and first sketch provide baseline records of expressive intention for this unit.","kana":"ザ エセイ アン ファースト スケチ プラヴァイド ベイスライン レコーズ アヴ イクスプレッシヴ インテンション フォ ディス ユナト、"},{"t":"Later records can be examined to distinguish ideas already present from those potentially introduced or confirmed by AI-generated images.","kana":"レイター レコーズ キャン ビー イグザマンド トゥ ディスティンググウィシュ アイディーアズ オールレディ プレザント フロム ゾウズ パテンシャリー イントロデュースト オール コンファームド バイ エイアイ・ジェネレイティド イミジズ、"},{"t":"Visual similarity on its own is insufficient evidence that an AI output caused a particular artistic choice.","kana":"ヴィジャワル シマレラティー オン イトス オウン イズ インサフィシャント エヴィデンス ザット アン エイアイ アウトプト カズド ア プティクヤル アルティスティク チョイス、"}]},{"title":"Slide 11 · CAPGAP: a lens from earlier research","image":"slides/slide-11.jpg","jp":"ここで、これまでの研究との関係を簡単に説明します。私たちは、AIとの制作中に生じるズレを、CAPGAPという枠組みで考えてきました。認知的なズレは、考えや構成を見直すことです。情意的なズレは、驚きや違和感などの感情です。対話的なズレは、AIや他者との関わりによって判断が動くことです。ただし、今回の研究で中心となるのは、この三分類そのものではなく、画像とのDistanceを生徒がどう調整したかです。","lines":[{"t":"The CAPGAP framework provides a supporting lens for interpreting cognitive, affective and participatory mismatches.","kana":"ザ キャップギャップ フレイムワーク プラヴァイドズ ア サポールティング レンズ フォ イントゥプレティング カグニティヴ, アフェクティヴ アン パルティサパトーリー ミスマチズ、"},{"t":"It is not treated as the main dependent variable in this study.","kana":"イット イズ ノット トリーティド アズ ザ メイン ディペンダント ヴェリーアバル イン ディス スタディ、"},{"t":"The empirical focus is how students adjust Distance through their decisions concerning AI-generated images.","kana":"ザ エムピリカル フォウカス イズ ハウ スチューデンツ アジャスト ディスタンス スルー ゼア ディシジョンズ カンスニング エイアイ・ジェネレイティド イミジズ、"}]},{"title":"Slide 12 · CSRI helps us read process traces","image":"slides/slide-12.jpg","jp":"これまでの別の研究では、画像を比べる、選ぶ、見直す、もう一度試す、という行為をCSRIと整理しました。これは、すべての生徒が必ず同じ順番で進むという意味ではありません。制作記録の中に現れた判断を読み取るための視点です。今回も、プロンプトや画像、スケッチ、短い振り返りを組み合わせ、生徒がAI案を受け入れた場面と、そこから離れた場面を見取る手がかりにします。前の研究では、CSRIで「AIの候補画像の中からどれを選んだか」をたどりました。今回は、その問いを「自分の作品に何を取り込んだか」へ広げます。","lines":[{"t":"CSRI—Compare, Select, Review and Iterate—provides a way to interpret process traces.","kana":"シー・エス・アール・アイ—コンペア, セレクト, リヴュー アン イタレイト—プラヴァイドズ ア ウェイ トゥ インタープレット プロセス トレイサズ、"},{"t":"The available records document different aspects of decision-making, but should not be taken to reconstruct every decision event or to imply that all learners completed identical cycles.","kana":"ザ アヴェイラバル レコーズ ダクヤメント ディファレント アスペクトス アヴ ディシジョン・メイキング, バット シュッド ノット ビー テイカン トゥ リーカンストラクト エヴイー ディシジョン イヴェント オール トゥ イムプライ ザット オール ルヌズ コンプリーティド アイデンティカル サイカルズ、"},{"t":"In the earlier study, CSRI was applied to choices among generated variants; the present study extends the inquiry to what is carried into the artwork.","kana":"イン ザ アーリア スタディ, シー・エス・アール・アイ ウォズ アプライド トゥ チョイシズ アマング ジェネレイティド ヴェリーアントス； ザ プレザント スタディ イクステンドズ ザ インクワイリー トゥ ウォット イズ カリード イントゥ ザ アートワーク、"}]},{"title":"Slide 13 · Compare   ·   Select   ·   Review   ·   Iterate","image":"slides/slide-13.jpg","jp":"ここで、授業で用いたCanvaの操作をご覧ください。言葉を入力すると複数の画像案が提示されます。生徒はそれを比較し、使いたい部分や違和感のある部分を考えます。もう一度生成する場合もあれば、描くことに戻る場合もあります。動画では、画像がつくられる回数だけでなく、その後にどのような選択が起こり得るのかに注目してください。","lines":[{"t":"This Canva demonstration illustrates the availability of multiple outputs and subsequent opportunities for comparison and revision.","kana":"ディス クアンヴア デマンストレイシャン イラストレイトス ザ アヴェイラビラティー アヴ マルタパル アウトプトス アン サブサクワント アプチューナティーズ フォ コンパリスン アン リヴィジョン、"},{"t":"It is an interface demonstration rather than empirical evidence from a particular participant.","kana":"イット イズ アン イントゥフェイス デマンストレイシャン ラズ ザン エムピリカル エヴィデンス フロム ア プティクヤル パルティサパント、"},{"t":"The analytical interest lies in decisions following generation, not generation alone.","kana":"ザ アナリティカル イントラスト ライズ イン ディシジョンズ ファロウイング ジェネレイション, ノット ジェネレイション アロウン、"}]},{"title":"Slide 14 · What records do we have?","image":"slides/slide-14.jpg","jp":"文章、スケッチ、AI画像、制作途中の作品、2回のアンケートを収集しました。ID・学級・出席番号がすべて一致した68人を2時点で照合でき、以降の数字はすべてこの68人を分母にしています。提出件数は補足資料A1に示しました。","lines":[{"t":"The dataset comprises essays, sketches, generated images, developing artworks and two questionnaires.","kana":"ザ デイタセト カムプライザズ エセイズ, スケチャズ, ジェネレイティド イミジズ, ディヴェラピング アートワークス アン トゥー クウェスチャネルズ、"},{"t":"Strict agreement on student ID, class and seat number yields 68 verified paired records, which serve as the single denominator for the main analyses.","kana":"ストリクト アグリーマント オン スチューデント アイ・ディー, クラス アン シート ナンバー イールドズ シクスティ・エイト ヴェリファイド ペルド レコーズ, ウィッチ スヴ アズ ザ シングガル ディナマネイトゥ フォ ザ メイン アナリシーズ、"},{"t":"Raw submission counts are reported in Appendix A1.","kana":"ラ サブミシャン カウンツ アー リポーティド イン アペンディクス アワン、"}]},{"title":"Slide 15 · Zero new images does not mean no AI use","image":"slides/slide-15.jpg","jp":"②の生成回数0回は、②の授業内で新しく画像を作らなかったという意味です。①で作った画像をもとに作品を進めている可能性があります。また①の生成回数の空欄には、授業時間が足りずAI使用まで進まなかったケースが含まれる可能性があります。ただし、時間不足の理由は質問紙で直接測っていないので、断定はしません。","lines":[{"t":"Survey 2 measured new image generation during the second lesson.","kana":"サーヴェイ トゥー メジュド ニュー イミジ ジェネレイション ドゥリング ザ セカンド レッスン、"},{"t":"A zero does not establish unit-level non-use, non-adoption or intentional disengagement.","kana":"ア ズィーロウ ダズ ノット イスタブリシュ ユナト・レヴァル ノン・ユーズ, ノン・アドプション オール インテンシャナル ディシンゲイジマント、"},{"t":"Earlier outputs could still be consulted, and blank Survey 1 answers may also reflect lesson progress or missing data.","kana":"アーリア アウトプトス クッド スティル ビー カンサルタド, アン ブラングク サーヴェイ ワン アンスズ メイ オールソウ リフレクト レッスン プラグレス オール ミシング デイタ、"},{"t":"Motives are not identified by the response categories.","kana":"モウティヴズ アー ノット アイデンタファイド バイ ザ リスポンス カタゴーリーズ、"}]},{"title":"Slide 16 · Two relationships to investigate","image":"slides/slide-16.jpg","jp":"研究では、①②のどこかでAIを使用したかという単元レベルの判定と、各授業の新規生成回数を区別します。また、AI画像の利用・参照と、作品に要素を採用したかは別指標です。①での未記録や②の0回の理由は本人の記述、生成履歴、作品の経過から検証します。","lines":[{"t":"We separate unit-level evidence of AI use, lesson-level generation counts and the degree of adoption.","kana":"ウィ セパレイト ユナト・レヴァル エヴィデンス アヴ エイアイ ユーズ, レッスン・レヴァル ジェネレイション カウンツ アン ザ ディグリー アヴ アドプション、"},{"t":"Reasons for changes in these measures are investigated rather than assumed.","kana":"リーズンズ フォ チェインジズ イン ジーズ メジュズ アー インヴェスタゲイタド ラズ ザン アシュームド、"},{"t":"An uncompleted first-lesson activity, a satisfactory earlier output and a preference for drawing are competing explanations requiring additional records.","kana":"アン アンカムプリーティド ファースト・レッスン アクティヴァティー, ア サタスファクトリー アーリア アウトプト アン ア プレフアンス フォ ドローイング アー カムピーティング エクスプラネイシャンズ リークワイアーイング アディシャナル レコーズ、"}]},{"title":"Slide 17 · Who used AI across the two lessons?","image":"slides/slide-17.jpg","jp":"ID・学級・番号で照合できた68人のうち、①または②で生成を確認できたのは45人です。生成回数の記録がなくても、②で画像の参照や採用を報告した8人を含め、AI使用ありは53人です。この53人の中には、①で生成回数の記録がなく②で初めて生成した5人が含まれます（53＋15＝68）。残る15人は「使用未確認」であり、積極的に使用を避けた生徒とは判断しません。","lines":[{"t":"Of 68 verified matched records, 45 contain affirmative generation reports, while a further eight contain affirmative self-reports of reference or adoption.","kana":"アヴ シクスティ・エイト ヴェリファイド マッチト レコーズ, フォーティ・ファイヴ カンテイン アフマティヴ ジェネレイション リポーツ, ワイル ア フズ エイト カンテイン アフマティヴ セルフ・リポーツ アヴ レフアンス オール アドプション、"},{"t":"Thus, 53 have evidence of AI use, whereas 15 remain unconfirmed.","kana":"ザス, フィフティ・スリー ハヴ エヴィデンス アヴ エイアイ ユーズ, ウェラズ フィフティーン リメイン アンコンファームド、"},{"t":"These are evidence-based classifications, not fixed student types or measures of dependence.","kana":"ジーズ アー エヴィデンス・ベイスト クラサファケイシャンズ, ノット フィクスト スチューデント タイプス オール メジュズ は避けます。生徒の理由と制作経過を合わせて確認する形成的評価につなげます。","lines":[{"t":"A formative assessment approach could examine three connected dimensions: the learner's expressive intention, the degree and form of adoption, and the reasons for retention, adaptation or rejection.","kana":"ア フォールマティヴ アセスマント アプロウチ クッド イグザミン スリー カネクティド ディメンシャンズ： ザ ルエアルンエルス イクスプレッシヴ インテンション, ザ ディグリー アン フォールム アヴ アドプション, アン ザ リーズンズ フォ リーテンシャン, アダプテイション オール リジェクション、"},{"t":"This is an assessment possibility rather than a validated instrument derived from these interim responses.","kana":"ディス イズ アン アセスマント パサビラティー ラズ ザン ア ヴァラデイティド インストラマント ドゥアイヴド フロム ジーズ インテリム リスポンシズ、"}]},{"title":"Slide 21 · Next: trace when, how, and why students use AI","image":"slides/slide-21.jpg","jp":"③と完成作品を加え、①②のどこで生成したか、前の画像を活用したか、採用した要素と理由を見ます。追加質問では「まだ生成に取りかかる時間がなかった」「前の画像で十分だった」「前の画像を使い続けた」「手描きを選んだ」「AIを使用しないと判断した」などを区別できるようにしたいです。","lines":[{"t":"Subsequent analysis will incorporate Survey 3, finished artworks and more complete process records.","kana":"サブサクワント アナリシス ウィル インコールプエイト サーヴェイ スリー, フィニシュト アートワークス アン モール コンプリート プロセス レコーズ、"},{"t":"It will examine use, adoption and decisions over time, while testing alternative explanations for zero new generation.","kana":"イット ウィル イグザミン ユーズ, アドプション アン ディシジョンズ オウヴ タイム, ワイル テスティング オールトゥナティヴ エクスプラネイシャンズ フォ ズィーロウ ニュー ジェネレイション、"},{"t":"Reasons such as insufficient time, satisfaction with earlier proposals or method preference must be verified independently.","kana":"リーズンズ サチ アズ インサフィシャント タイム, サティスファクション ウィズ アーリア プラポウザルズ オール メソッド プレフアンス マスト ビー ヴェリファイド インディペンダントリー、"}]},{"title":"Slide 22 · Distance concerns decisions, not a single generation count.","image":"slides/slide-22.jpg","jp":"結論です。①または②のいずれかでAIを使用した生徒は、単元全体では使用ありと分類します。②で新しく生成しなかったからといって、①での使用は消えません。Distanceとして捉えたいのは、画像を何回生成したかだけでなく、生徒が自分の意図に照らして何を残し、何を変え、何を手放したかという判断です。","lines":[{"t":"Distance concerns the learner's evolving relationship with AI-generated proposals in relation to expressive intention.","kana":"ディスタンス カンスンズ ザ ルエアルンエルス イヴァルヴィング リレイションシップ ウィズ エイアイ・ジェネレイティド プラポウザルズ イン リレイション トゥ イクスプレッシヴ インテンション、"},{"t":"Neither lesson-level generation counts nor visual similarity alone establish that relationship.","kana":"ニーズ レッスン・レヴァル ジェネレイション カウンツ ノール ヴィジャワル シマレラティー アロウン イスタブリシュ ザット リレイションシップ、"},{"t":"The current paired records show why earlier AI involvement must not be erased by a later zero.","kana":"ザ クアント ペルド レコーズ ショウ ワイ アーリア エイアイ インヴァルヴマント マスト ノット ビー イレイスト バイ ア レイター ズィーロウ、"},{"t":"These remain interim findings requiring fuller process analysis.","kana":"ジーズ リメイン インテリム ファインディングズ リークワイアーイング フル プロセス アナリシス、"}]},{"title":"Slide A1 · Appendix A1: Submission counts","image":"slides/slide-23.jpg","jp":"アンケート①98件、②77件の提出があり、重複を含みます。ID、学級、出席番号の一致を確認したうえで、68人を2時点で照合できました。②の7提出は照合に確認が必要です。質問紙の提出件数と2時点照合済み人数を区別して発表します。","lines":[{"t":"The extracts contain 98 Survey 1 submissions and 77 Survey 2 submissions.","kana":"ザ エクストラクトス カンテイン ナインティ・エイト サーヴェイ ワン サブミシャンズ アン セヴンティ・セヴン サーヴェイ トゥー サブミシャンズ、"},{"t":"Strict agreement on student ID, class and seat number supports 68 verified paired records.","kana":"ストリクト アグリーマント オン スチューデント アイ・ディー, クラス アン シート ナンバー サポールトス シクスティ・エイト ヴェリファイド ペルド レコーズ、"},{"t":"Seven Survey 2 submissions remain unresolved.","kana":"セヴァン サーヴェイ トゥー サブミシャンズ リメイン アンリザルヴド、"},{"t":"Analyses of all submissions and analyses restricted to matched participants consequently have different denominators.","kana":"アナリシーズ アヴ オール サブミシャンズ アン アナリシーズ リーストリクタド トゥ マッチト パルティサパントス カンサクワントリー ハヴ ディファレント ドエンオムインアトオルス、"}]},{"title":"Slide A2 · Appendix A2: Not yet used is not opting out","image":"slides/slide-24.jpg","jp":"①で「AIは使っていない／使わない予定」を選択したのは有効回答93件中25件です。しかし、IDで厳密に対応させると、この選択肢を選んだ生徒のうち4人は②でAI画像を生成しています。したがって①の回答のみで「AIを使用しないことを選択した」と判断してはいけません。授業進行上、まだ画像生成に取りかかれなかった可能性もあります。","lines":[{"t":"A compound response option in Survey 1 merged previous non-use with a future intention not to use AI.","kana":"ア カムパウンド リスポンス アプシャン イン サーヴェイ ワン ムジド プリーヴィアス ノン・ユーズ ウィズ ア フユチュ インテンション ノット トゥ ユーズ エイアイ、"},{"t":"Twenty-five of 93 valid respondents selected it, yet at least four securely matched students subsequently reported image generation in Survey 2.","kana":"トゥエンティ・ファイヴ アヴ ナインティ・スリー ヴァリド リスパンダントス セレクティド イット, イェト アト リースト フォー シクユルリー マッチト スチューデンツ サブサクワントリー リポーティド イミジ ジェネレイション イン サーヴェイ トゥー、"},{"t":"The earlier item should not be used as a stable classification of non-users.","kana":"ザ アーリア アイタム シュッド ノット ビー ユーズド アズ ア ステイバル クラサファケイシャン アヴ ノン・ユーザーズ、"}]}];

  const synth = window.speechSynthesis;

  function renderSections(target, sections, modeName) {
    target.innerHTML = "";
    let index = 0;

    sections.forEach((section, sectionIndex) => {
      const box = document.createElement("section");
      box.className = "slide-section";
      box.dataset.mode = modeName;
      box.dataset.section = String(sectionIndex);

      const h2 = document.createElement("h2");
      h2.textContent = section.title;
      box.appendChild(h2);
      const slidePhoto=document.createElement("img");
      slidePhoto.className="slide-photo";
      slidePhoto.loading="lazy";
      slidePhoto.src=section.image;
      slidePhoto.alt=section.title+" のスライド";
      slidePhoto.addEventListener("click",()=>{
        const d=document.getElementById("zoomLayer");
        document.getElementById("zoomImage").src=section.image;
        if(d.showModal)d.showModal();
      });
      box.appendChild(slidePhoto);

      section.lines.forEach(line => {
        const button = document.createElement("button");
        button.className = "line-card";
        button.type = "button";
        button.dataset.mode = modeName;
        button.dataset.index = String(index);

        const speakText = line.s || line.t || stripHtml(line.h || "");
        button.dataset.speak = speakText;

        const num = document.createElement("span");
        num.className = "num";
        num.textContent = String(index + 1).padStart(2, "0");

        const txt = document.createElement("span");
        txt.className = "txt";
        if (line.h) txt.innerHTML = line.h;
        else txt.textContent = line.t;
        if (line.kana) {
          const pron=document.createElement("small");
          pron.className="kana";
          pron.textContent=line.kana;
          txt.appendChild(pron);
        }

        const icon = document.createElement("span");
        icon.className = "play-icon";
        icon.textContent = "▶";

        button.append(num, txt, icon);
        box.appendChild(button);
        index++;
      });

      if (section.jp) {
        const jp=document.createElement("p");jp.className="jp-text";
        jp.textContent=section.jp;
        box.appendChild(jp);
      }
      target.appendChild(box);
    });
  }

  function stripHtml(value) {
    const div = document.createElement("div");
    div.innerHTML = value;
    return div.textContent || "";
  }

  renderSections(mainMode, MAIN_SECTIONS, "main");
  renderSections(qaMode, QA_SECTIONS, "qa");

  function cards() {
    return [...document.querySelectorAll(`.line-card[data-mode="${mode}"]`)];
  }

  function normalizeIndex(i) {
    const cs = cards();
    if (!cs.length) return 0;
    return Math.max(0, Math.min(i, cs.length - 1));
  }

  function selectCard(i, scroll = true) {
    const cs = cards();
    current = normalizeIndex(i);

    document.querySelectorAll(".line-card").forEach(el => el.classList.remove("active"));
    const card = cs[current];

    if (!card) return;

    card.classList.add("active");
    now.textContent =
      `${mode === "main" ? "発表原稿" : "Academic"}：${current + 1} / ${cs.length}　${card.dataset.speak}`;

    if (scroll) {
      card.scrollIntoView({behavior:"smooth", block:"center"});
    }
  }

  function refreshVoices() {
    if (!("speechSynthesis" in window)) return;
    const list = synth.getVoices();

    if (list && list.length) voices = list;

    const previous = voiceSel.value;
    const english = voices.filter(v => /^en([-_]|$)/i.test(v.lang));
    const usable = english.length ? english : voices;

    voiceSel.innerHTML = '<option value="">端末の音声を使用（WAIE方式）</option>';

    usable.forEach(v => {
      const option = document.createElement("option");
      option.value = `${v.name}|||${v.lang}`;
      option.textContent = `${v.name} (${v.lang})${v.default ? " — default" : ""}`;
      voiceSel.appendChild(option);
    });

    if (previous && [...voiceSel.options].some(o => o.value === previous)) {
      voiceSel.value = previous;
      return;
    }

    // Keep the blank/default option until the user explicitly selects an installed voice.
  }

  function getSelectedVoice() {
    refreshVoices();

    if (!voiceSel.value) return null;

    const [name, lang] = voiceSel.value.split("|||");
    return voices.find(v => v.name === name && v.lang === lang) ||
           voices.find(v => v.name === name) ||
           null;
  }

  function hardStop() {
    playToken++;
    stopped = true;
    activeUtterance = null;

    if ("speechSynthesis" in window) {
      try { synth.cancel(); } catch(e) {}
    }
  }

  function speakText(text, onEnd, token, interrupt = false) {
    if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
      now.textContent = "このブラウザでは音声読み上げを利用できません。Safari / Chrome / Edgeで開いてください。";
      return;
    }

    const run = () => {
      if (token !== playToken || stopped) return;

      refreshVoices();

      const utterance = new SpeechSynthesisUtterance(text);
      activeUtterance = utterance;

      utterance.rate = Number(rate.value);
      utterance.pitch = 1.0;
      utterance.volume = 1.0;
      utterance.lang = "en-US"; // WAIEと同じ標準エンジン。UK声がある場合は選択。

      const selected = getSelectedVoice();
      if (selected) {
        utterance.voice = selected;
        utterance.lang = selected.lang || "en-US";
      }

      utterance.onstart = () => {
        if (token !== playToken) return;
        const cs = cards();
        const card = cs[current];
        if (card) {
          now.textContent =
            `🔊 ${mode === "main" ? "発表原稿" : "Academic"}：${current + 1} / ${cs.length}　${card.dataset.speak}`;
        }
      };

      utterance.onend = () => {
        if (token !== playToken || stopped) return;
        activeUtterance = null;
        if (typeof onEnd === "function") onEnd();
      };

      utterance.onerror = (event) => {
        if (token !== playToken || stopped) return;
        activeUtterance = null;

        if (event.error === "canceled" || event.error === "interrupted") return;

        now.textContent = `音声エラー（${event.error || "不明"}）。英語音声を「端末の音声を使用（WAIE方式）」にして、もう一度本文を押してください。`;
      };

      try {
        if (synth.paused) synth.resume();
        synth.speak(utterance);
      } catch (e) {
        now.textContent = "音声を開始できませんでした。もう一度タップしてください。";
      }
    };

    if (interrupt && (synth.speaking || synth.pending)) {
      try { synth.cancel(); } catch(e) {}
      setTimeout(run, 120);
    } else {
      run();
    }
  }

  function startSingle() {
    hardStop();
    stopped = false;
    const token = playToken;
    const card = cards()[current];
    if (!card) return;

    // 初回はユーザーのタップから直接 speak() へ進む
    speakText(card.dataset.speak, null, token, false);
  }

  function startSequence() {
    hardStop();
    stopped = false;
    const token = playToken;

    const next = () => {
      if (token !== playToken || stopped) return;

      const cs = cards();
      const card = cs[current];
      if (!card) return;

      selectCard(current, false);

      speakText(card.dataset.speak, () => {
        if (token !== playToken || stopped) return;

        if (current < cards().length - 1) {
          current++;
          selectCard(current, true);
          setTimeout(next, 350);
        } else {
          stopped = true;
          now.innerHTML = '<span class="status-ok">✅ 最後まで再生しました。</span>';
        }
      }, token, false);
    };

    next();
  }

  function repeatThree() {
    hardStop();
    stopped = false;
    const token = playToken;
    let remaining = 3;

    const loop = () => {
      if (token !== playToken || stopped || remaining <= 0) return;

      const card = cards()[current];
      if (!card) return;

      remaining--;

      speakText(card.dataset.speak, () => {
        if (token !== playToken || stopped) return;

        if (remaining > 0) {
          setTimeout(loop, 650);
        } else {
          stopped = true;
          now.innerHTML = '<span class="status-ok">✅ 3回練習が終わりました。</span>';
        }
      }, token, false);
    };

    loop();
  }

  function switchMode(nextMode) {
    hardStop();
    mode = nextMode;
    current = 0;

    document.querySelectorAll(".tab").forEach(tab => {
      tab.classList.toggle("active", tab.dataset.tab === mode);
    });

    mainMode.classList.toggle("hidden", mode !== "main");
    qaMode.classList.toggle("hidden", mode !== "qa");

    selectCard(0, false);
  }

  rate.addEventListener("input", () => {
    rateLabel.textContent = Number(rate.value).toFixed(2) + "×";
  });

  document.getElementById("playAll").addEventListener("click", () => {
    refreshVoices();
    startSequence();
  });

  document.getElementById("playOne").addEventListener("click", () => {
    refreshVoices();
    startSingle();
  });

  document.getElementById("repeat3").addEventListener("click", () => {
    refreshVoices();
    repeatThree();
  });

  document.getElementById("prev").addEventListener("click", () => {
    hardStop();
    selectCard(current - 1);
  });

  document.getElementById("next").addEventListener("click", () => {
    hardStop();
    selectCard(current + 1);
  });

  document.getElementById("stop").addEventListener("click", () => {
    hardStop();
    now.textContent = "■ 停止しました";
  });

  document.addEventListener("click", (event) => {
    const card = event.target.closest(".line-card");
    if (!card) return;

    mode = card.dataset.mode;
    current = Number(card.dataset.index);

    document.querySelectorAll(".tab").forEach(tab => {
      tab.classList.toggle("active", tab.dataset.tab === mode);
    });

    mainMode.classList.toggle("hidden", mode !== "main");
    qaMode.classList.toggle("hidden", mode !== "qa");

    selectCard(current, false);
    refreshVoices();
    startSingle();
  });

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => switchMode(tab.dataset.tab));
  });

  // iPhone / iPadでは音声一覧がページ読み込み直後に空のことがあるため複数回確認
  refreshVoices();
  setTimeout(refreshVoices, 250);
  setTimeout(refreshVoices, 800);
  setTimeout(refreshVoices, 1600);

  if ("speechSynthesis" in window) {
    if (typeof synth.addEventListener === "function") {
      synth.addEventListener("voiceschanged", refreshVoices);
    } else if ("onvoiceschanged" in synth) {
      synth.onvoiceschanged = refreshVoices;
    }
  }

  // iOS/Safariでバックグラウンド復帰後にpausedが残る場合の保険
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && synth && synth.paused) {
      try { synth.resume(); } catch(e) {}
    }
  });

  // 最初のタップで音声一覧を再取得
  const warmUp = () => {
    refreshVoices();
    if (synth && synth.paused) {
      try { synth.resume(); } catch(e) {}
    }
  };
  document.addEventListener("touchend", warmUp, {once:true, passive:true});
  document.addEventListener("pointerup", warmUp, {once:true, passive:true});

  selectCard(0, false);
  // カタカナ／日本語表示切り替え
  document.getElementById("showKana").addEventListener("change", e=> document.body.classList.toggle("no-kana", !e.target.checked));
  document.getElementById("showJp").addEventListener("change", e=> document.body.classList.toggle("no-jp", !e.target.checked));
  const jumpTo=document.getElementById("jumpTo");
  MAIN_SECTIONS.forEach((sec,i)=>{
    const o=document.createElement("option");o.value=String(i);o.textContent=sec.title;jumpTo.appendChild(o);
  });
  jumpTo.addEventListener("change",()=>{
    const i=Number(jumpTo.value);if(jumpTo.value==='')return;
    const section=document.querySelectorAll('#'+(mode==='main'?'mainMode':'qaMode')+' .slide-section')[i];
    if(section){hardStop();section.scrollIntoView({behavior:'smooth',block:'start'});const card=section.querySelector('.line-card');if(card)selectCard(Number(card.dataset.index),false)}
  });
  document.getElementById("voiceTest").addEventListener("click",()=>{
    hardStop();stopped=false;
    const token=playToken;
    speakText('Hello. Welcome to the Vienna English practice.',()=>{now.textContent='✅ 音声テスト終了'},token,false);
  });
  document.getElementById("zoomClose").addEventListener("click",()=>document.getElementById("zoomLayer").close());
  document.getElementById("zoomLayer").addEventListener("click",e=>{if(e.target.id==='zoomLayer')e.target.close()});


})();
</script>

</body>
</html>
